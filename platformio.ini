[platformio]
default_envs = coronet_os2

[env:coronet_os2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = coronet_jc3248w535
framework = arduino
monitor_speed = 115200
upload_speed = 921600
extra_scripts = pre:scripts/version.py
custom_firmware_version = 0.3.0

board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

build_flags =
    -D CORONET_OS2
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL=0
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER=0
    -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER=1
    -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL=1
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -D CONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=247
    ; Keep the NimBLE host heap in PSRAM; controller and task-critical memory stay internal.
    -D CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=1

lib_deps =
    h2zero/NimBLE-Arduino@2.5.1
    links2004/WebSockets@2.7.2
    lvgl/lvgl@8.4.0
    bblanchon/ArduinoJson@7.4.3
