name: Firmware CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install PlatformIO
        run: python -m pip install -r requirements.txt

      - name: Resolve firmware version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid release tag: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
          else
            version="0.3.0-dev"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build firmware
        env:
          CORONET_FIRMWARE_VERSION: ${{ steps.version.outputs.version }}
        run: pio run

      - name: Validate release artifacts
        run: >-
          python scripts/validate_release_artifacts.py
          .pio/build/coronet_os2
          "${{ steps.version.outputs.version }}"

      - name: Prepare firmware assets
        shell: bash
        run: |
          mkdir -p dist
          cp .pio/build/coronet_os2/firmware.bin dist/coronet_os2.bin
          cp .pio/build/coronet_os2/bootloader.bin dist/coronet_bootloader.bin
          cp .pio/build/coronet_os2/partitions.bin dist/coronet_partitions.bin
          md5sum dist/coronet_os2.bin | awk '{print $1}' > dist/coronet_os2.bin.md5
          (cd dist && sha256sum coronet_os2.bin coronet_bootloader.bin coronet_partitions.bin > SHA256SUMS.txt)

      - name: Prepare Flash Download Tool package
        run: >-
          python scripts/prepare_flash_tool_package.py
          .pio/build/coronet_os2
          "${{ steps.version.outputs.version }}"

      - name: Prepare detailed release notes
        if: github.ref_type == 'tag'
        run: >-
          python scripts/extract_release_notes.py
          docs/UPDATES.md
          "${{ steps.version.outputs.version }}"
          dist/RELEASE_NOTES.md

      - name: Upload development firmware
        uses: actions/upload-artifact@v7
        with:
          name: coronet-os2-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/coronet_os2.bin
            dist/coronet_os2.bin.md5
            dist/coronet_bootloader.bin
            dist/coronet_partitions.bin
            dist/SHA256SUMS.txt
            dist/*_Flash_Tool.zip

      - name: Publish tagged GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --title "coroNET OS 2 ${{ steps.version.outputs.version }}" \
              --notes-file dist/RELEASE_NOTES.md
          gh release upload "${GITHUB_REF_NAME}" \
            dist/coronet_os2.bin \
            dist/coronet_os2.bin.md5 \
            dist/coronet_bootloader.bin \
            dist/coronet_partitions.bin \
            dist/SHA256SUMS.txt \
            dist/coroNET_OS_2_*_Flash_Tool.zip \
            --clobber
