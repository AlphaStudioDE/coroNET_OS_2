name: Firmware CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install PlatformIO
        run: python -m pip install -r requirements.txt

      - name: Resolve firmware version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid release tag: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
          else
            version="0.3.3-dev"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build firmware
        env:
          CORONET_FIRMWARE_VERSION: ${{ steps.version.outputs.version }}
        run: pio run

      - name: Validate LED catalog
        run: python scripts/validate_led_catalog.py

      - name: Validate release artifacts
        run: >-
          python scripts/validate_release_artifacts.py
          .pio/build/coronet_os2
          "${{ steps.version.outputs.version }}"

      - name: Prepare firmware assets
        shell: bash
        run: |
          mkdir -p dist
          cp .pio/build/coronet_os2/firmware.bin dist/coronet_os2.bin
          cp .pio/build/coronet_os2/bootloader.bin dist/coronet_bootloader.bin
          cp .pio/build/coronet_os2/partitions.bin dist/coronet_partitions.bin
          md5sum dist/coronet_os2.bin | awk '{print $1}' > dist/coronet_os2.bin.md5
          (cd dist && sha256sum coronet_os2.bin coronet_bootloader.bin coronet_partitions.bin > SHA256SUMS.txt)

      - name: Prepare Flash Download Tool package
        shell: bash
        run: |
          python scripts/prepare_flash_tool_package.py \
            .pio/build/coronet_os2 \
            "${{ steps.version.outputs.version }}"
          (cd dist && sha256sum \
            coronet_os2.bin.md5 \
            coroNET_OS_2_*_Flash_Tool.zip >> SHA256SUMS.txt)

      - name: Prepare detailed release notes
        if: github.ref_type == 'tag'
        run: >-
          python scripts/extract_release_notes.py
          docs/UPDATES.md
          "${{ steps.version.outputs.version }}"
          dist/RELEASE_NOTES.md

      - name: Set up Java for Android release
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Test Android companion
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Restore Android release signing key
        if: github.ref_type == 'tag'
        env:
          CORONET_ANDROID_KEYSTORE_BASE64: ${{ secrets.CORONET_ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          test -n "${CORONET_ANDROID_KEYSTORE_BASE64}"
          printf '%s' "${CORONET_ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/coronet-release.jks"
          test -s "${RUNNER_TEMP}/coronet-release.jks"

      - name: Build signed Android companion
        if: github.ref_type == 'tag'
        working-directory: android
        env:
          CORONET_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/coronet-release.jks
          CORONET_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CORONET_ANDROID_KEYSTORE_PASSWORD }}
          CORONET_ANDROID_KEY_ALIAS: ${{ secrets.CORONET_ANDROID_KEY_ALIAS }}
          CORONET_ANDROID_KEY_PASSWORD: ${{ secrets.CORONET_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Prepare Android companion asset
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk dist/coroNET_Companion.apk
          build_tools="$(find "${ANDROID_SDK_ROOT}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "${build_tools}/apksigner" verify --verbose --print-certs dist/coroNET_Companion.apk
          (cd dist && sha256sum coroNET_Companion.apk >> SHA256SUMS.txt)

      - name: Upload development firmware
        uses: actions/upload-artifact@v7
        with:
          name: coronet-os2-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/coronet_os2.bin
            dist/coronet_os2.bin.md5
            dist/coronet_bootloader.bin
            dist/coronet_partitions.bin
            dist/SHA256SUMS.txt
            dist/*_Flash_Tool.zip
            dist/coroNET_Companion.apk

      - name: Publish tagged GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --title "coroNET OS 2 ${{ steps.version.outputs.version }}" \
              --notes-file dist/RELEASE_NOTES.md
          gh release upload "${GITHUB_REF_NAME}" \
            dist/coronet_os2.bin \
            dist/coronet_os2.bin.md5 \
            dist/coronet_bootloader.bin \
            dist/coronet_partitions.bin \
            dist/SHA256SUMS.txt \
            dist/coroNET_OS_2_*_Flash_Tool.zip \
            dist/coroNET_Companion.apk \
            --clobber
