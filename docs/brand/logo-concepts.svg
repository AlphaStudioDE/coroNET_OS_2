<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <rect width="1400" height="760" fill="#071018"/>

  <text x="72" y="82" fill="#F4F8FA" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">coroNET identity study</text>
  <text x="72" y="120" fill="#8FAAB7" font-family="Arial, Helvetica, sans-serif" font-size="18">Existing app icon and the recommended Core Horizon evolution</text>

  <g transform="translate(72 174)">
    <rect width="380" height="430" rx="8" fill="#0D1A24" stroke="#29414F"/>
    <text x="28" y="42" fill="#8FAAB7" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">CURRENT APP ICON</text>
    <g transform="translate(82 86) scale(2)">
      <rect width="108" height="108" rx="18" fill="#10161B"/>
      <path fill="#20D6C7" d="M54,12A42,42 0,1 0,54 96A42,42 0,1 0,54 12"/>
      <path fill="#10161B" d="M54,27A27,27 0,1 0,54 81A27,27 0,1 0,54 27"/>
      <path fill="#10161B" d="M54,22H102V86H54Z"/>
      <path fill="#20D6C7" d="M50,12H82V27H50ZM50,81H82V96H50Z"/>
      <path fill="#FFFFFF" d="M54,45A9,9 0,1 0,54 63A9,9 0,1 0,54 45"/>
    </g>
    <text x="28" y="350" fill="#F4F8FA" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Good idea, uneven geometry</text>
    <text x="28" y="382" fill="#8FAAB7" font-family="Arial, Helvetica, sans-serif" font-size="16">Recognizable C and core, but the right side</text>
    <text x="28" y="406" fill="#8FAAB7" font-family="Arial, Helvetica, sans-serif" font-size="16">feels heavy and the center is disconnected.</text>
  </g>

  <g transform="translate(484 174)">
    <rect width="844" height="430" rx="8" fill="#0D1A24" stroke="#29414F"/>
    <text x="28" y="42" fill="#27D3C2" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">RECOMMENDED · CORE HORIZON</text>

    <g transform="translate(54 80)">
      <rect width="216" height="216" rx="42" fill="#10161B"/>
      <path d="M158 56 C130 28 86 25 56 50 C20 79 19 135 54 168 C82 195 128 194 159 160"
            fill="none" stroke="#27D3C2" stroke-width="18" stroke-linecap="round"/>
      <path d="M108 108 H184" fill="none" stroke="#27D3C2" stroke-width="12" stroke-linecap="round"/>
      <circle cx="108" cy="108" r="12" fill="#F4F8FA"/>
      <circle cx="184" cy="108" r="7" fill="#F1B84B"/>
    </g>

    <g transform="translate(316 106)">
      <text x="0" y="74" fill="#F4F8FA" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="300">coro</text>
      <text x="158" y="74" fill="#27D3C2" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="700">NET</text>
      <line x1="4" y1="104" x2="355" y2="104" stroke="#29414F" stroke-width="2"/>
      <text x="4" y="142" fill="#8FAAB7" font-family="Arial, Helvetica, sans-serif" font-size="18">CONNECTED PRINT ENVIRONMENT</text>
      <text x="4" y="194" fill="#F1B84B" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">OS 2</text>
      <text x="58" y="194" fill="#8FAAB7" font-family="Arial, Helvetica, sans-serif" font-size="17">open-source platform</text>
    </g>

    <text x="54" y="350" fill="#F4F8FA" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Core · horizon · connection</text>
    <text x="54" y="382" fill="#8FAAB7" font-family="Arial, Helvetica, sans-serif" font-size="16">Balanced at icon size, meaningful in motion, and simple enough for</text>
    <text x="54" y="406" fill="#8FAAB7" font-family="Arial, Helvetica, sans-serif" font-size="16">one-color printing, engraving, documentation, and the boot screen.</text>
  </g>

  <g transform="translate(72 638)">
    <text x="0" y="26" fill="#8FAAB7" font-family="Arial, Helvetica, sans-serif" font-size="15">Motion signature</text>
    <circle cx="154" cy="20" r="7" fill="#F4F8FA"/>
    <path d="M184 20 H310" stroke="#27D3C2" stroke-width="5" stroke-linecap="round"/>
    <path d="M370 3 C350 -17 318 -18 297 0 C272 21 272 60 296 82" transform="translate(46 -22) scale(.55)" fill="none" stroke="#27D3C2" stroke-width="11" stroke-linecap="round"/>
    <text x="380" y="26" fill="#F4F8FA" font-family="Arial, Helvetica, sans-serif" font-size="15">core wakes</text>
    <text x="476" y="26" fill="#29414F" font-family="Arial, Helvetica, sans-serif" font-size="15">/</text>
    <text x="496" y="26" fill="#F4F8FA" font-family="Arial, Helvetica, sans-serif" font-size="15">horizon travels</text>
    <text x="620" y="26" fill="#29414F" font-family="Arial, Helvetica, sans-serif" font-size="15">/</text>
    <text x="640" y="26" fill="#F4F8FA" font-family="Arial, Helvetica, sans-serif" font-size="15">corona forms</text>
    <text x="748" y="26" fill="#29414F" font-family="Arial, Helvetica, sans-serif" font-size="15">/</text>
    <text x="768" y="26" fill="#F4F8FA" font-family="Arial, Helvetica, sans-serif" font-size="15">network opens</text>
  </g>
</svg>
